name: daily-post

on:
  schedule:
    # 18:02 JST = 09:02 UTC（毎日）
    - cron: "2 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish next queued post
        run: node scripts/publish-next.js

      - name: Commit and push
        run: |
          git config user.name "murinaku-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "queue empty — nothing to commit"
          else
            git commit -m "Publish scheduled post"
            git push
          fi
