name: refill-queue

# 2026-11-03: ANTHROPIC_API_KEY が無効（401）になったため、定期の補充は止めた。
# 補充はクラウドの自動実行（routine「ブログ運転C」）が毎日 queue を見て書く。手動の実行だけ残す。
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Generate one essay even if queue is full (test)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  refill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate essays if queue below 5
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE: ${{ github.event.inputs.force }}
        run: node scripts/generate-essays.js

      - name: Commit and push
        run: |
          git config user.name "murinaku-bot"
          git config user.email "actions@users.noreply.github.com"
          git add queue/
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Auto-refill essay queue"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
